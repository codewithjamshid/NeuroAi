[project]
name = "neuroai-ai-worker"
version = "0.1.0"
description = "NeuroAI AI worker (STT / TTS / voice-emotion / medllm) — GPU servis; laptopda faqat skelet"
readme = "README.md"
# Ofis GPU kompyuteri Python 3.11 (TZ §4.2), laptop 3.12 (.python-version).
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24",
]

[tool.uv]
package = false

# ADR-006: ruff (lint + import tartibi) + black (format), line-length 100
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
