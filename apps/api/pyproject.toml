[project]
name = "neuroai-api"
version = "0.1.0"
description = "NeuroAI backend — FastAPI, SQLAlchemy 2 async, Alembic (TZ §4.2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "greenlet>=3",
  "alembic>=1.14",
  "pydantic>=2",
  "pydantic-settings>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "black>=24",
]

# Virtual project: `app` is imported from the working directory (uvicorn, pytest `pythonpath`,
# alembic `prepend_sys_path`), nothing is built or installed into the venv.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]  # local alembic/ dir must not shadow the package

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
